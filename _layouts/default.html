<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" href="https://platform.digitalbdg.ac.id/favicon.ico">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <header class="pdb-bilah">
      <div class="pdb-bilah-isi">
        <a class="pdb-merek" href="https://platform.digitalbdg.ac.id/">
          <img src="https://platform.digitalbdg.ac.id/assets/img/logo.png" alt="" width="28" height="28">
          <span>Platform Digital Bandung</span>
        </a>
        <nav class="pdb-nav">
          <a href="{{ '/' | relative_url }}">Panduan</a>
          <a href="{{ '/mahasiswa/' | relative_url }}">Mahasiswa</a>
          <a href="{{ '/dosen/' | relative_url }}">Dosen</a>
          <a href="{{ '/kaprodi/' | relative_url }}">Kaprodi</a>
          <a href="{{ '/admin/' | relative_url }}">Admin</a>
          <a class="pdb-masuk" href="https://platform.digitalbdg.ac.id/">Buka aplikasi</a>
        </nav>
      </div>
    </header>
    <main class="container-lg px-3 my-5 markdown-body pdb-isi">
      {{ content }}
    </main>
    <footer class="pdb-kaki">
      <div class="pdb-bilah-isi">
        <span>Akademi Digital Bandung · Program Sarjana Terapan kelas pekerja</span>
        <span><a href="https://platform.digitalbdg.ac.id/program.html">Tentang program</a> · <a href="https://platform.digitalbdg.ac.id/apidocs/">Dokumentasi API</a></span>
      </div>
    </footer>
  </body>
</html>
